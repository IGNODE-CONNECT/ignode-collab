name: Lint notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nbqa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install nbqa flake8 black

      - name: Run flake8 on notebooks
        run: nbqa flake8 colab/ --max-line-length=120 --extend-ignore=E402,E501,W503

      - name: Check black formatting on notebooks
        run: nbqa black --check colab/ --line-length 120
